[package]
name = "banshee-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
banshee-proto = { version = "0.1.0", path = "../proto" }
bytes = "1.12.1"
quinn = "0.11.12"
rcgen = "0.14.10"
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
banshee-client = { path = "../client" }
