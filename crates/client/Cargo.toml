[package]
name = "banshee-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
banshee-proto = { version = "0.1.0", path = "../proto" }
bytes = "1.12.1"
quinn = "0.11.12"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-std", "io-util"] }
