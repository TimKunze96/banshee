services:
  banshee:
    image: ghcr.io/timkunze96/banshee:main
    build: .
    restart: unless-stopped
    ports:
      - "7700:7700/udp"
      # for Let's Encrypt, with BANSHEE_DOMAIN set
      - "80:8080/tcp"
    environment:
      BANSHEE_CHANNELS: "Lobby,Gaming,AFK"
      # your domain, pointing at this machine: people connect with banshee://<domain>
      # BANSHEE_DOMAIN: "voice.example.com"
      # BANSHEE_ACME_EMAIL: "you@example.com"
    volumes:
      - data:/data

volumes:
  data:
